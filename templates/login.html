<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <title>登入 · 股票推薦</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="static/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="static/style.css?v={{ v }}">
</head>
<body class="login-page">
  <form method="post" class="panel login">
    <img src="static/icons/icon-192.png" alt="" width="64" height="64">
    <h1>股票推薦</h1>
    <input type="password" name="password" placeholder="密碼" autocomplete="current-password" autofocus required>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit">登入</button>
  </form>
</body>
</html>
