<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="股票推薦">
  <title>股票推薦</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}" defer></script>
</head>
<body>
  <div id="offline" class="offline hidden">離線中，顯示的是上次收集的資料</div>
  <header>
    <div>
      <h1>股票推薦</h1>
      <p class="sub">技術指標 + 新聞情緒自動評分{% if demo %} · <span class="tag demo">離線展示模式</span>{% endif %}</p>
    </div>
    <div class="actions">
      <span id="status" class="muted"></span>
      <button id="collect-btn">立即收集</button>
      {% if auth %}<form method="post" action="/logout"><button class="link" type="submit">登出</button></form>{% endif %}
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>推薦排行</h2>
        <form id="add-form">
          <input id="add-symbol" placeholder="代號，如 2330 或 AAPL" required>
          <input id="add-name" placeholder="名稱（選填）">
          <button type="submit">加入觀察</button>
        </form>
      </div>
      <div class="table-wrap">
        <table id="rec-table">
          <thead>
            <tr><th>股票</th><th class="num">收盤</th><th class="num">漲跌</th><th class="num">評分</th><th>建議</th><th class="num">新聞情緒</th><th><span class="sr-only">操作</span></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="empty" class="muted hidden">尚無資料，請按「立即收集」。</p>
    </section>

    <section id="detail" class="panel hidden">
      <div class="panel-head">
        <h2 id="d-title"></h2>
        <span id="d-rating" class="rating"></span>
      </div>
      <div class="detail-grid">
        <div>
          <div class="chart-box"><canvas id="price-chart"></canvas></div>
          <div class="chart-box small"><canvas id="rsi-chart"></canvas></div>
        </div>
        <div>
          <h3>評分組成</h3>
          <div id="d-breakdown"></div>
          <h3>判斷依據</h3>
          <ul id="d-reasons"></ul>
          <h3>指標</h3>
          <dl id="d-ind"></dl>
        </div>
      </div>
      <h3>相關新聞（自動收集）</h3>
      <ul id="d-news" class="news"></ul>
    </section>

    <section class="panel">
      <h2>最新新聞</h2>
      <ul id="all-news" class="news"></ul>
    </section>

    <p class="disclaimer">本工具僅依公開資料自動計算，不構成任何投資建議。投資有風險，請自行判斷。</p>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
